[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-sim"
version = "0.1.0"
description = "Rocket landing simulation with real-time physics and RL agent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "stable-baselines3>=2.2",
    "torch>=2.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
viewer = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
